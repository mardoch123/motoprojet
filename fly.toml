# =============================================================================
# Configuration Fly.io — MotoProjet
# =============================================================================
# Déploiement gratuit sur Fly.io (3 VMs gratuites)
# Doc : https://fly.io/docs/
# =============================================================================

app = 'motoprojet-api'
primary_region = 'cdg'  # Paris

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    path = '/health'
    interval = '30s'
    timeout = '10s'
