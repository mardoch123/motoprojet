# fly.toml app configuration file generated for motoprojet on 2026-08-11T07:56:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'motoprojet'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
