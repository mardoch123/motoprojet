name: motoprojet
description: "Système de financement de motos-taxis et voitures-taxis au Bénin"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Auth & Security
  flutter_secure_storage: ^9.2.4
  jwt_decoder: ^2.0.1
  crypto: ^3.0.6

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Local Storage (offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.5.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  url_launcher: ^6.3.1

  # KKiaPay (Mobile Money)
  kkiapay_flutter_sdk:
    git:
      url: https://github.com/kkiapay/kkiapay-flutter-sdk.git
      ref: master

  # GPS / Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.70.2

  # Export
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  csv: ^6.0.0

  # Monitoring
  sentry_flutter: ^8.14.0

  # Notifications Push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/
