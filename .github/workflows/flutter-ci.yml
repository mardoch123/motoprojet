# =============================================================================
# Flutter CI — Analyse, Tests, Build
# Déclenché à chaque push sur main/develop et chaque PR
# =============================================================================
name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'test/**'

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Analyse statique + Tests ───────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file for CI
        run: |
          echo "API_BASE_URL=https://api.motoprojet.bj" > .env
          echo "API_TIMEOUT=30000" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code (lint)
        run: flutter analyze --no-fatal-infos

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 7

  # ─── 2. Build Android (debug) ──────────────────────────────────────────────
  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "API_BASE_URL=https://api.motoprojet.bj" > .env
          echo "API_TIMEOUT=30000" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─── 3. Build Web (vérification compilation) ───────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "API_BASE_URL=https://api.motoprojet.bj" > .env
          echo "API_TIMEOUT=30000" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release
        continue-on-error: true
